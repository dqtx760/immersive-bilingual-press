<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>沉浸式双语译林</title>
  <link rel="stylesheet" href="ui-base.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body data-theme="retro-paper" data-ready="false">
  <main class="popup-shell">
    <header class="brand-row">
      <span class="brand-mark" id="logo-badge-text" aria-hidden="true">译</span>
      <h1 id="app-title">沉浸式双语译林</h1>
      <button class="settings-entry" id="open-settings-btn" type="button">
        <span id="open-settings-label">打开设置页</span>
        <span aria-hidden="true">↗</span>
      </button>
    </header>

    <section class="language-section" aria-labelledby="label-lang-direction">
      <div class="section-title" id="label-lang-direction">翻译语种方向</div>
      <div class="language-pair">
        <label class="language-field" for="source-lang-select">
          <span id="label-source-lang">源语言</span>
          <select id="source-lang-select" class="select-input" aria-label="源语言">
            <option value="auto">自动检测</option>
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="fr">法语</option>
            <option value="de">德语</option>
            <option value="es">西班牙语</option>
            <option value="ru">俄语</option>
            <option value="pt">葡萄牙语</option>
            <option value="ar">阿拉伯语</option>
          </select>
        </label>
        <button class="swap-button" id="swap-lang-btn" type="button" aria-label="交换源语言和目标语言" title="交换源语言和目标语言">⇄</button>
        <label class="language-field" for="target-lang-select">
          <span id="label-target-lang">目标语言</span>
          <select id="target-lang-select" class="select-input" aria-label="目标语言">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="en">英语</option>
            <option value="ja">日语</option>
            <option value="ko">韩语</option>
            <option value="fr">法语</option>
            <option value="de">德语</option>
            <option value="es">西班牙语</option>
            <option value="ru">俄语</option>
            <option value="pt">葡萄牙语</option>
            <option value="ar">阿拉伯语</option>
          </select>
        </label>
      </div>
    </section>

    <section class="engine-section" aria-labelledby="label-engine-select">
      <div class="section-title" id="label-engine-select">翻译引擎选择</div>
      <div class="segmented-control" id="engine-switcher" role="group" aria-labelledby="label-engine-select">
        <button class="seg-btn active" id="btn-engine-google" type="button" data-engine-val="google" aria-pressed="true">Google翻译</button>
        <button class="seg-btn" id="btn-engine-api" type="button" data-engine-val="api" aria-pressed="false">云端 API</button>
      </div>
    </section>

    <button class="ui-button primary translate-button" id="toggle-page-btn" type="button">
      <span class="translate-button-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" focusable="false">
          <path fill="currentColor" d="M12.87 15.07 10.33 12.56l.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.5 9.75 9 11.35 8.03 10.38 7.23 9.26 6.62 8h-2c.73 1.63 1.72 3.11 2.93 4.38l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04ZM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12Zm-2.62 7 1.62-4.33L19.12 17h-3.24Z" />
        </svg>
      </span>
      <span class="translate-button-label" id="toggle-btn-text">翻译</span>
    </button>

    <div class="status-message" id="popup-message" role="status" aria-live="polite" data-empty="true">
      <span id="popup-message-text"></span>
      <button class="configure-api-button hidden" id="configure-api-btn" type="button">配置云端 API</button>
    </div>
  </main>

  <script src="ui-common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
